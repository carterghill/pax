[package]
name = "pax"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[profile.dev]
# On macOS, incremental builds leave new debug object files in deps on each edit.
incremental = false

[profile.dev.package."*"]
# Keep file and line numbers for dependency backtraces and full debug info for Pax.
debug = "line-tables-only"

# Keep the two Windows installer variants in separate Cargo and Tauri output directories.
[profile.release-nvenc]
inherits = "release"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"
cc = "1"
webrtc-sys-build = "0.3.13"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Default includes `native-tls` (OpenSSL); use `rustls-tls` for Android cross-builds.
# 0.16.1 fixes the SDK's recursion-limit overflow with Rust 1.94.
matrix-sdk = { version = "0.16.1", default-features = false, features = [
  "e2e-encryption",
  "automatic-room-key-forwarding",
  "sqlite",
  "rustls-tls",
] }
matrix-sdk-sqlite = "=0.16.1"
matrix-sdk-store-encryption = "=0.16.1"
rmp-serde = "1.3"
rusqlite = "0.37"
tokio = { version = "1", features = ["full"] }
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
data-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
kuchikiki = "=0.8.8-speedreader"
quick-xml = { version = "0.38.4", features = ["serialize", "overlapped-lists"] }
reqwest-middleware = { version = "0.4", default-features = false, features = [
  "json",
] }
reqwest-retry = "0.7"
urlencoding = "2"
jsonwebtoken = "9"
# Disable the default glib-main-loop feature since Tauri/GTK already runs one
libwebrtc = { version = "0.3", default-features = false }
cpal = "0.15"
futures-util = "0.3"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"
image = { version = "0.24", default-features = false, features = ["jpeg"] }
parking_lot = "0.12"
once_cell = "1.19"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
nnnoiseless = "0.5.2"
mime = "0.3"
uuid = { version = "1", features = ["v4", "v5"] }
argon2 = { version = "0.5.3", features = ["zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
zeroize = "1.8"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
screenshots = "0.8"
user-idle = "0.6"

# Native GPU overlay rendering (zero-IPC video)
wgpu = "25"
raw-window-handle = "0.6"
pollster = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
png = "0.18.1"
wasapi = "0.22"
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }
windows-capture = "1.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["async-secret-service", "crypto-rust", "tokio"] }
glib = "0.18"
zbus = { version = "4", default-features = false, features = ["tokio"] }
webkit2gtk = { version = "2.0", features = ["v2_38"] }
ashpd = { version = "0.12", default-features = true }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
gstreamer-pbutils = "0.24"

[target.'cfg(not(target_os = "android"))'.dependencies]
livekit = { version = "0.7", features = ["rustls-tls-native-roots"] }

[target.'cfg(target_os = "android")'.dependencies]
# Use the bundled public CA roots for LiveKit's Rust WebSocket client on Android.
livekit = { version = "0.7", features = ["rustls-tls-webpki-roots"] }
jni = "0.21"

[patch.crates-io]
livekit = { path = "livekit-local" }
libwebrtc = { path = "libwebrtc-local" }
webrtc-sys = { path = "webrtc-sys-local" }
